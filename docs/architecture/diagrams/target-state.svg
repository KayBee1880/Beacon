<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Target State: full mesh vision</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#b3401f">Most of this does not exist yet. See Roadmap for what's built vs. planned.</text>

  <!-- DEVICE A -->
  <rect x="40" y="90" width="260" height="380" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="170" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Device A</text>
  <rect x="60" y="130" width="220" height="50" rx="6" fill="#eef4ff" stroke="#1a4d8f" stroke-width="1.5"/>
  <text x="170" y="160" text-anchor="middle" font-size="11.5" fill="#1a4d8f">UI (Jetpack Compose)</text>
  <rect x="60" y="195" width="220" height="60" rx="6" fill="#eaf7ef" stroke="#1f7a3d" stroke-width="1.5"/>
  <text x="170" y="220" text-anchor="middle" font-size="11.5" fill="#1f7a3d">Domain / Service</text>
  <text x="170" y="238" text-anchor="middle" font-size="9.5" fill="#1f7a3d">(Identity, Message, Crypto)</text>
  <rect x="60" y="270" width="220" height="60" rx="6" fill="#fff3e6" stroke="#b3701f" stroke-width="1.5"/>
  <text x="170" y="295" text-anchor="middle" font-size="11.5" fill="#b3701f">Transport</text>
  <text x="170" y="313" text-anchor="middle" font-size="9.5" fill="#b3701f">BLE (built) + Wi-Fi Direct (planned)</text>
  <rect x="60" y="345" width="220" height="50" rx="6" fill="#f5eefc" stroke="#6a2fa8" stroke-width="1.5"/>
  <text x="170" y="375" text-anchor="middle" font-size="11.5" fill="#6a2fa8">Room / SQLite (built)</text>

  <!-- DEVICE B -->
  <rect x="700" y="90" width="260" height="380" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="830" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Device B</text>
  <rect x="720" y="130" width="220" height="50" rx="6" fill="#eef4ff" stroke="#1a4d8f" stroke-width="1.5"/>
  <text x="830" y="160" text-anchor="middle" font-size="11.5" fill="#1a4d8f">UI (Jetpack Compose)</text>
  <rect x="720" y="195" width="220" height="60" rx="6" fill="#eaf7ef" stroke="#1f7a3d" stroke-width="1.5"/>
  <text x="830" y="220" text-anchor="middle" font-size="11.5" fill="#1f7a3d">Domain / Service</text>
  <text x="830" y="238" text-anchor="middle" font-size="9.5" fill="#1f7a3d">(Identity, Message, Crypto)</text>
  <rect x="720" y="270" width="220" height="60" rx="6" fill="#fff3e6" stroke="#b3701f" stroke-width="1.5"/>
  <text x="830" y="295" text-anchor="middle" font-size="11.5" fill="#b3701f">Transport</text>
  <text x="830" y="313" text-anchor="middle" font-size="9.5" fill="#b3701f">BLE (built) + Wi-Fi Direct (planned)</text>
  <rect x="720" y="345" width="220" height="50" rx="6" fill="#f5eefc" stroke="#6a2fa8" stroke-width="1.5"/>
  <text x="830" y="375" text-anchor="middle" font-size="11.5" fill="#6a2fa8">Room / SQLite (built)</text>

  <!-- DIRECT LINK -->
  <line x1="300" y1="300" x2="700" y2="300" stroke="#333" stroke-width="2" marker-start="url(#arrowT)" marker-end="url(#arrowT)"/>
  <text x="500" y="285" text-anchor="middle" font-size="11.5" fill="#222">Direct link: encrypted, single hop</text>
  <text x="500" y="300" text-anchor="middle" font-size="10" fill="#666">(Milestone 3, planned)</text>

  <!-- RELAY DEVICE -->
  <circle cx="500" cy="450" r="60" fill="#fbeee8" stroke="#b3401f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="500" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#b3401f">Relay Device</text>
  <text x="500" y="462" text-anchor="middle" font-size="10" fill="#b3401f">(Milestone 6)</text>

  <line x1="440" y1="410" x2="330" y2="330" stroke="#b3401f" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowT)"/>
  <line x1="560" y1="410" x2="670" y2="330" stroke="#b3401f" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowT)"/>
  <text x="500" y="500" text-anchor="middle" font-size="10.5" fill="#b3401f">Store-and-forward when A and B are never both in range at once</text>

  <text x="500" y="565" text-anchor="middle" font-size="11" fill="#666">Legend: solid boxes/lines = built · dashed = planned. Per-layer status is in the Tech Stack tables below.</text>
</svg>
